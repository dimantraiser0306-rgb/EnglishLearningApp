<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="reset.css">
</head>

<body>
    <main class="main">
        <div class="container">
            <div class="input__block">
                <div class="add__button-wrap">

                    <button class="button__add">Ad</button>
                    <form class="form" action="">
                        <button class="add__expression hidden">Add Expression</button>
                        <input class="input__add hidden" type="text" placeholder="Enter your espression">
                    </form>
                </div>
                <div class="list">
                    <div class="list__block hidden">
                        <ol class="ordered__list">

                        </ol>
                    </div>
                </div>
                <div class="input__wrap">
                    <div class="expression__block">

                    </div>
                    <form action="submit">
                        <input class="input" type="text" placeholder="Enter the answer...">
                        <button class="button">Check</button>
                    </form>
                </div>
            </div>
            <div class="next__expression-wrap">
                <button class="next__expression">Next Expression</button>
            </div>
            <div class="showErrorsBlock">
                <div class="show__errors-block"></div>
            </div>
        </div>
    </main>
    <script type="module" src="main.js"></script>
</body>

</html>
